<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ribeiro | Design de Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #b96cff;
            --bg-black: #020005;
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
        }

        /* Melhoria na rolagem para dispositivos móveis */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif; 
        }

        html, body {
            background-color: var(--bg-black);
            color: var(--text-main);
            min-height: 100%;
            /* Permite rolagem se o conteúdo for maior que a tela, comum no Android */
            overflow-x: hidden;
            overflow-y: auto; 
            -webkit-font-smoothing: antialiased;
            scroll-behavior: smooth;
        }

        /* --- BACKGROUND GALÁCTICO PREMIUM --- */
        #nebula-canvas {
            position: fixed;
            top: 0; left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .ambient-light {
            position: fixed;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at 80% 20%, rgba(138, 43, 226, 0.1), transparent 50%),
                        radial-gradient(circle at 15% 85%, rgba(185, 108, 255, 0.05), transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        /* --- NAVIGATION --- */
        header {
            padding: 40px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            position: relative;
        }

        .logo {
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .logo span { color: var(--accent); }

        .availability {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 6px; height: 6px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
        }

        /* --- LAYOUT CENTRAL --- */
        main {
            min-height: calc(100vh - 200px); /* Garante que preencha a tela mas permita crescer */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 80px;
            padding: 40px 8%;
            z-index: 10;
            max-width: 1800px;
            margin: 0 auto;
            position: relative;
        }

        /* --- CONTEÚDO TEXTUAL --- */
        .hero-text { max-width: 600px; position: relative; }

        .hero-text h1 {
            font-size: clamp(45px, 7vw, 90px);
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -0.06em;
            margin-bottom: 30px;
            animation: textReveal 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }

        @keyframes textReveal {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-text h1 span {
            color: var(--accent);
            background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text p {
            font-size: clamp(16px, 2vw, 20px);
            color: var(--text-dim);
            line-height: 1.5;
            margin-bottom: 40px;
            max-width: 480px;
            font-weight: 300;
        }

        /* --- BOTÃO PREMIUM --- */
        .btn-premium {
            position: relative;
            padding: 22px 50px;
            background: transparent;
            color: white;
            text-decoration: none;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            display: inline-block;
            overflow: hidden;
            z-index: 20;
        }

        .btn-premium:hover {
            color: black;
            border-color: white;
            transform: translateY(-5px);
        }

        .btn-premium::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: white;
            transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: -1;
        }

        .btn-premium:hover::before { left: 0; }

        /* --- VISUAL DE IMPACTO --- */
        .hero-visual {
            position: relative;
            perspective: 1000px;
        }

        .photo-card {
            width: clamp(280px, 35vw, 450px);
            height: clamp(350px, 45vw, 560px);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            position: relative;
            z-index: 2;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .photo-card img {
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.9;
            transition: 1s ease;
        }

        .light-effect {
            position: absolute;
            top: 50%; left: 50%;
            width: 180%; height: 180%;
            background: conic-gradient(from 0deg at 50% 50%, transparent 0%, var(--accent) 5%, transparent 15%, transparent 100%);
            transform: translate(-50%, -50%);
            animation: rotateLight 12s linear infinite;
            filter: blur(50px);
            z-index: 1;
            opacity: 0.3;
        }

        @keyframes rotateLight {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* --- FOOTER --- */
        footer {
            padding: 40px 8%;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.2);
            z-index: 10;
            position: relative;
        }

        /* --- AJUSTES MOBILE (ANDROID/IPHONE) --- */
        @media (max-width: 1024px) {
            main { 
                flex-direction: column-reverse; 
                text-align: center; 
                gap: 60px; 
                padding: 60px 20px 100px 20px; 
                min-height: auto;
            }
            .hero-text h1 { font-size: 48px; }
            .hero-text p { margin: 0 auto 40px auto; }
            .photo-card { width: 280px; height: 350px; margin: 0 auto; }
            footer { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>
    <canvas id="nebula-canvas"></canvas>

    <header>
        <div class="logo">Ribeiro<span>/</span>Design</div>
        <div class="availability">
            <div class="status-dot"></div>
            Disponível
        </div>
    </header>

    <main>
        <div class="hero-text">
            <h1>DOMINE SEU <span>MERCADO.</span></h1>
            <p>Design estratégico focado em autoridade visual. Transformo negócios comuns em marcas líderes através de soluções exclusivas.</p>
            
            <a href="https://wa.me/5517997515685?text=Olá%20Ribeiro,%20vim%20pelo%20seu%20site%20e%20gostaria%20de%20um%20projeto%20de%20design%20estratégico." class="btn-premium" target="_blank">
                Iniciar Consultoria
            </a>
        </div>

        <div class="hero-visual">
            <div class="light-effect"></div>
            <div class="photo-card" id="card">
                <img src="profile-removebg-preview.png" alt="Designer Ribeiro">
            </div>
        </div>
    </main>

    <footer>
        <div>© RIBEIRO STUDIO 2026</div>
        <div>DESIGN ESTRATÉGICO & EXPERIÊNCIA VISUAL</div>
    </footer>

    <script>
        const canvas = document.getElementById("nebula-canvas");
        const ctx = canvas.getContext("2d");
        let width, height, stars = [];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            stars = Array.from({length: 100}, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                speed: Math.random() * 0.05 + 0.01
            }));
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = "rgba(185, 108, 255, 0.3)";
            stars.forEach(s => {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
                s.y += s.speed;
                if (s.y > height) s.y = 0;
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener("resize", init);
        init();
        animate();

        // Efeito de inclinação suave (apenas desktop para não bugar o toque no mobile)
        if (window.innerWidth > 1024) {
            const card = document.getElementById('card');
            document.addEventListener('mousemove', (e) => {
                let xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                let yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
        }
    </script>
</body>
</html>
